---
# https://github.com/REMnux/salt-states/tree/master/remnux/repos

# https://launchpad.net/~remnux/+archive/ubuntu/stable
- name: Adding Remnux repo
  ansible.builtin.deb822_repository:
    name: remnux
    types: deb
    uris: https://ppa.launchpadcontent.net/remnux/stable/ubuntu
    suites: '{{ ansible_distribution_release }}'
    components: main
    architectures: amd64
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?fingerprint=on&op=index&search=0xE90F33EEF615660D25A02D32BFF45016788DE115"

# https://launchpad.net/~sift/+archive/ubuntu/stable
- name: Adding SIFT repository
  ansible.builtin.deb822_repository:
    name: sift
    types: deb
    uris: https://ppa.launchpadcontent.net/sift/stable/ubuntu
    suites: '{{ ansible_distribution_release }}'
    components: main
    architectures: amd64
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?fingerprint=on&op=index&search=0xE90F33EEF615660D25A02D32BFF45016788DE115"

- name: Install draios apt gpg key
  ansible.builtin.get_url:
    url: https://s3.amazonaws.com/download.draios.com/DRAIOS-GPG-KEY.public
    dest: /etc/apt/trusted.gpg.d/DRAIOS-GPG-KEY.asc
    mode: '0644'
  register: pkg_result
  until: pkg_result is success
  when: false

- name: Adding Draios repository (sysdig)
  ansible.builtin.deb822_repository:
    name: draios
    types: deb
    uris: https://download.sysdig.com/stable/deb
    suites: '{{ ansible_distribution_release }}'
    components: "stable-{{ ansible_architecture }}"
    signed_by: https://s3.amazonaws.com/download.draios.com/DRAIOS-GPG-KEY.public
  when:
    - ansible_facts['distribution'] == 'Debian' or ansible_facts['distribution'] == 'Ubuntu'
    - false

- name: Enabling multiverse repository
  ansible.builtin.replace:
    dest: /etc/apt/sources.list
    regexp: '^#(\.*)multiverse$'
    replace: '\1multiverse'
    mode: '0644'
    backup: yes

# https://www.jeffgeerling.com/blog/2022/aptkey-deprecated-debianubuntu-how-fix-ansible
- name: Adding wireshark-dev gpg key
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xa2e402b85a4b70cd78d8a3d9d875551314eca0f0"
    dest: /etc/apt/trusted.gpg.d/wireshark-dev.asc
    mode: '0644'
    owner: root
- name: Adding wireshark-dev ppa repository
  ansible.builtin.deb822_repository:
    name: wireshark-dev
    types: deb
    uris: https://ppa.launchpadcontent.net/wireshark-dev/stable/ubuntu
    suites: '{{ ansible_distribution_release }}'
    components: main
    signed_by: /etc/apt/trusted.gpg.d/wireshark-dev.asc
